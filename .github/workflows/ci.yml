name: Tests

on:
  pull_request:
    branches:
      # '**' und nicht '*': Der Filter gilt dem ZIEL-Branch, nicht dem Branch,
      # von dem der Pull Request kommt -- und der einfache Stern matcht keinen
      # Schraegstrich. Ein gestapelter Pull Request, der auf einen Branch wie
      # claude/basis zeigt statt auf main, bekam damit gar keine Pruefung, und
      # zwar lautlos: es gab keine rote Pruefung, es gab ueberhaupt keine.
      - '**'
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Standardrb Check
        run: bundle exec standardrb

      - name: Run tests
        run: |
          bundle exec rspec
